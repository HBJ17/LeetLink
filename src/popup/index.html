<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeetLink</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>Leet<span>Link</span></h1>
      <button id="settings" type="button" class="link">Settings</button>
    </header>

    <section id="repo"></section>

    <section id="last-push-section" hidden>
      <h2>Last push</h2>
      <div id="last-push"></div>
    </section>

    <section id="queue-section" hidden>
      <h2>Waiting to retry</h2>
      <div id="queue"></div>
    </section>

    <section id="import-section" hidden>
      <h2>Past submissions</h2>
      <div id="import"></div>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
